    <!--
      One HTML shell for the whole site. Everything below that names a page
      rather than the project is a default for the front page, and is rewritten
      per URL at the edge before the response ships: see
      functions/_middleware.ts. HTMLRewriter edits elements, it cannot invent
      ones the document never had, so every tag it needs to touch has to exist
      here first.
    -->
    <title>Bengali Experience: Bengal, Bangla Culture and Nostalgia, Free</title>
    <meta
      name="description"
      content="A digital collection of the small, ordinary things a Bengali grows up inside. The driver's music on the bus, the radio at four in the morning on Mahalaya, Sunday's mangsho bhaat and the sleep after it. Rebuilt to sit inside again, from anywhere."
    />
    <meta
      name="keywords"
      content="bengali experience,bengali culture website,bangla culture online,bengali nostalgia,kolkata nostalgia,bengali culture for the diaspora,durga puja online experience,mahalaya online,bangla adda,bengali interactive website"
    />

    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="category" content="culture" />
    <link rel="canonical" href="https://bengaliexperience.wtf/" />

    <meta property="og:site_name" content="Bengali Experience" />
    <meta property="og:locale" content="en_IN" />

    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />

    <!--
      The crawler body, hidden from anyone whose browser runs JavaScript.

      functions/_middleware.ts injects a full text version of the page into
      #root for crawlers that do not execute JavaScript. React clears #root on
      its first paint, but that is after the bundle has downloaded, parsed and
      run, so until then the raw markup is on screen: a flash of unstyled
      headings and FAQ on every load, worse the slower the connection.

      This is the ordinary progressive-enhancement answer. The class lands
      while the head is still parsing, before anything has painted, so a
      browser with JavaScript never shows the fallback for a single frame. A
      client that does not run scripts never gets the class and reads the text
      normally. It is not cloaking: the hidden markup says exactly what the
      React page goes on to say, and a crawler that does execute JavaScript
      sees that page rather than this.
    -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      .js #prerender { display: none !important; }
    </style>

    <script type="application/ld+json" id="ld-json">{}</script>

    <!--
      Microsoft Clarity. Session replay and heatmaps, which is the only way to
      see whether people actually sit through the scenes or leave partway. The
      tag loads itself asynchronously, so it never blocks the first paint.
    -->
    <script>
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i + "?ref=bwt";
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "y2nocf9q82");
    </script>
  </head>
