  <style>
    body { min-height: 100svh; display: flex; flex-direction: column; }

    #alpana {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      touch-action: none;
      cursor: crosshair;
      opacity: 0;
      animation: bloom-in 2.2s var(--ease-out) 0.2s forwards;
    }
    @keyframes bloom-in {
      from { opacity: 0; transform: scale(0.92) rotate(-6deg); }
      to { opacity: 1; transform: none; }
    }

    .hero {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 var(--gutter) 12vh;
      max-width: 680px;
      pointer-events: none;
    }
    .hero a,
    .hero button { pointer-events: auto; }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(42px, 6.2vw, 92px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      text-shadow: 0 2px 30px rgba(15, 11, 10, 0.6);
    }
    h1 .light { font-weight: 300; }

    .lede {
      margin: 28px 0 0;
      max-width: 30ch;
      font-size: clamp(16px, 1.45vw, 19px);
      line-height: 1.6;
      font-weight: 300;
      color: var(--muted);
      text-shadow: 0 1px 18px rgba(15, 11, 10, 0.9);
    }
    .lede strong { color: var(--cream); font-weight: 500; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 22px;
      margin-top: 36px;
    }
    .hint {
      font-size: 12.5px;
      color: var(--muted);
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
    }
    .hint kbd {
      font: inherit;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--faint);
      background: rgba(255, 255, 255, 0.04);
    }

    @media (max-width: 860px) {
      .hero { justify-content: flex-end; padding-top: 44vh; padding-bottom: 15vh; }
      .hint { display: none; }
      h1 { font-size: clamp(38px, 11vw, 64px); }
      .lede { margin-top: 18px; }
      .actions { margin-top: 24px; }
    }
  </style>
</head>

  <div class="vignette" aria-hidden="true"></div>
  <canvas id="alpana" aria-hidden="true"></canvas>

  <header class="top">
    <a class="mark" href="/"><span class="bead" aria-hidden="true"></span>bengaliexperience</a>
    <span class="pill"><span class="pulse" aria-hidden="true"></span>Coming soon</span>
  </header>

  <main class="hero">
    <h1 class="split"><span class="light">Something</span> <span class="gloss-text">really interesting</span> is on its way.</h1>
    <p class="lede fade-in" style="--d: 1.1s">
      The internet is about to get a lot more <strong>Bengali</strong>. Something fresh for Bengal and every Bengali, wherever you are, is landing here soon.
    </p>
    <div class="actions fade-in" style="--d: 1.35s">
      <a class="btn" href="https://konkomaji.com" rel="noopener">Follow the making <span class="arrow" aria-hidden="true">→</span></a>
      <span class="hint" aria-hidden="true"><kbd>tap</kbd> the alpana · <kbd>fly</kbd> a kite · <kbd>honk</kbd> the taxi</span>
    </div>
  </main>
