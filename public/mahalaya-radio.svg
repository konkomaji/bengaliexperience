<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#150803"/>
  <!-- antenna -->
  <line x1="22" y1="9" x2="28" y2="3" stroke="#c9a06a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cabinet -->
  <rect x="4" y="9" width="24" height="17" rx="3" fill="#8a5a2b"/>
  <rect x="4" y="9" width="24" height="17" rx="3" fill="none" stroke="#5c3a1a" stroke-width="1"/>
  <!-- speaker grille -->
  <rect x="6.5" y="12" width="9" height="11" rx="1.5" fill="#3a2512"/>
  <g stroke="#5c3a1a" stroke-width="1">
    <line x1="8" y1="12.5" x2="8" y2="22.5"/>
    <line x1="10" y1="12.5" x2="10" y2="22.5"/>
    <line x1="12" y1="12.5" x2="12" y2="22.5"/>
    <line x1="14" y1="12.5" x2="14" y2="22.5"/>
  </g>
  <!-- glowing dial -->
  <rect x="17.5" y="12" width="8.5" height="5" rx="1" fill="#ffbf5c"/>
  <line x1="21.5" y1="12" x2="21.5" y2="17" stroke="#7a3e10" stroke-width="0.9"/>
  <!-- knobs -->
  <circle cx="19.5" cy="21.5" r="2" fill="#2a1a0c" stroke="#5c3a1a" stroke-width="0.8"/>
  <circle cx="24.5" cy="21.5" r="2" fill="#2a1a0c" stroke="#5c3a1a" stroke-width="0.8"/>
</svg>
